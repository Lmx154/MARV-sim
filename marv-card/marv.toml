# MARV vehicle card: the only source of the vehicle's physical numbers.
# Schema and rules: MARV-V2-drivers/_plan/decision-sim-card-20261119.md. SI units; body frame FRD at the centre of mass.
# Every number is a record: { v = value, unit, tag, src, range }. Tags: measured, datasheet, cad, derived, placeholder.
# Check it with: cargo run -q -p marv-card --bin card-check -- marv-card/marv.toml env/default.toml

[card]
name = "MARV"
schema = 1

[motors]
src = "PLAN:decision-sim-conventions-20261119.md section 5"
front_right = { dshot_line = 0, spin = "ccw" }
rear_right  = { dshot_line = 1, spin = "cw" }
front_left  = { dshot_line = 2, spin = "cw" }
rear_left   = { dshot_line = 3, spin = "ccw" }

# >>> BEGIN GENERATED by CAD:tools/make_card.py -- do not edit, rerun the generator
[cad_export]
file = "CAD:model/mass_properties.json"
sha256 = "72c5d36bca03d4a373386814c90b790de2db8d3b73676b5b3cafc67bc621ed35"
cad_commit = "334ab3c4ca27354604eb28236f9b6208366076b1"
configuration = "nominal: battery group at the solved batt_x (CG X on the motor centroid X)"
measured_share_item_pct = 93.76001709584357
region_sha256 = "348f815e441ec139edef6ba47bb487edfc44c7bd6563d71916b173769ffed7cf"

[mass]
mass = { v = 0.74872, unit = "kg", tag = "cad", src = "totals.mass_kg" }
com_in_cad = { v = [0.0004957610347100225, 3.2636342135788814e-07, 0.03178273318322473], unit = "m", tag = "cad", src = "totals.cg_mm / 1000; CAD axes; this point is the body origin" }
inertia = { v = [[0.005154679857046977, 2.4833027020082455e-07, 3.7419240430837696e-05], [2.4833027020082455e-07, 0.004953419958023371, -5.230716206177631e-08], [3.7419240430837696e-05, -5.230716206177631e-08, 0.009219341614679171]], unit = "kg.m^2", tag = "cad", range_pct = [-25.0, 25.0], src = "totals.inertia_kg_m2, about the centre of mass, rotated to FRD; range: owner, handoff:196" }

# FRD from the centre of mass, m: the thrust point on the motor axis at the prop hub plane.
[rotor_position]
front_right = { v = [0.11324671874295816, 0.123806923519697, -0.0003965532437157684], unit = "m", tag = "cad", src = "motors[FR].axis_xy_mm; cg_relative.prop_plane_z_mm" }
rear_right = { v = [-0.11324671872973802, 0.12442766177348297, -0.0003965532437157684], unit = "m", tag = "cad", src = "motors[RR].axis_xy_mm; cg_relative.prop_plane_z_mm" }
front_left = { v = [0.11324671913986205, -0.12380626742281033, -0.0003965532437157684], unit = "m", tag = "cad", src = "motors[FL].axis_xy_mm; cg_relative.prop_plane_z_mm" }
rear_left = { v = [-0.11324671915308221, -0.12442700567981552, -0.0003965532437157684], unit = "m", tag = "cad", src = "motors[RL].axis_xy_mm; cg_relative.prop_plane_z_mm" }

# Spin seen from above, from the CAD prop types; card-check compares it with [motors].
[rotor_spin_cad]
front_right = "ccw"
rear_right = "cw"
front_left = "cw"
rear_left = "ccw"
# <<< END GENERATED

# Per rotor; all four alike until the thrust test (step 6). Source table: the Emax ECO II 2807 1700KV vendor table for
# the HQ 7x3.5x3 prop at 16.8 V (CAD:model/motor_bench.yaml:14-19; owner, 2026-11-19: "use this").
[propulsion]
thrust_coefficient = { v = 4.47e-6, unit = "N/(rad/s)^2", tag = "derived", range_pct = [-30.0, 30.0], src = "least squares T = k w^2 through the origin over the 5 rows with an rpm, CAD:model/motor_bench.yaml:14-18; hover (about 6100 rpm) is below the lowest row; range: owner, handoff:196" }
moment_coefficient = { v = 0.0161, unit = "m", tag = "placeholder", range = "ask", src = "reaction torque / thrust; mean over the same 5 rows of 0.85 * power / (thrust * w), CAD:model/motor_bench.yaml:14-18; the 85 % efficiency is ASSUMED (CAD:model/drone_params.yaml:57); rows give 0.0130 to 0.0185" }
max_rotor_speed = { v = 2126.0, unit = "rad/s", tag = "placeholder", range = "ask", src = "speed where k w^2 equals the full-throttle 2060 g row, CAD:model/motor_bench.yaml:19; an extrapolation: the table gives no rpm for that row and its highest rpm is 14600" }
time_constant_up = { v = 0.045, unit = "s", tag = "placeholder", range = [0.030, 0.060], src = "CAD:model/drone_params.yaml:59, ESTIMATED 'typical for a 7-inch prop'; range: owner, handoff:196" }
time_constant_down = { v = 0.06, unit = "s", tag = "placeholder", range = [0.030, 0.060], src = "CAD:model/drone_params.yaml:60, ESTIMATED 'typical for a 7-inch prop'; range: owner, handoff:196" }
level_min = { v = 1, unit = "level", tag = "datasheet", src = "dshot Throttle::MIN_LEVEL, DRV:dshot/src/value.rs:37" }
level_max = { v = 2000, unit = "level", tag = "datasheet", src = "dshot Throttle::MAX_LEVEL, DRV:dshot/src/value.rs:39" }
# The lowest level the allocator sends while armed. A starting value; the thrust test (step 6) replaces it.
idle_level = { v = 111, unit = "level", tag = "placeholder", range = [100, 201], src = "owner 2026-11-19 took the recommendation: 5.5 % of the 1..2000 range, as Betaflight motorIdle 550 and PX4 DSHOT_MIN 0.055; range up to ArduPilot MOT_SPIN_ARM 0.10 (PLAN:facts-flight-references-20261119.md section 1)" }
# Speed command is linear in level from (level_min, speed_at_level_min) to (level_max, max_rotor_speed).
speed_at_level_min = { v = 0.0, unit = "rad/s", tag = "placeholder", range = [0, 129], src = "none; owner 2026-11-19 took the recommendation: 0 with a linear map until the thrust test; range upper bound: the props-off idle speed measured on the board on 2026-11-19, 2280 rpm at level 111, props add load so it bounds the props-on idle speed (decision-sim-takeoff-landing-20261119.md section 6)" }

# Body drag: force_i = -c_i * va_i * |va_i|, va = air-relative velocity in body FRD.
[drag]
body = { v = [0.0, 0.0, 0.0], unit = "N/(m/s)^2", tag = "placeholder", range = "ask", src = "none; owner 2026-11-19 took the recommendation: term off for steps 4 and 5, a value before the wind scenario" }
# Linear rotor drag: force_xy = -rotor_linear * va_xy in body x and y, none in z; va as above.
rotor_linear = { v = 0.0, unit = "N/(m/s)", tag = "placeholder", range = [0.0, 0.41], src = "none; term off (owner 2026-11-19, as drag.body); range upper bound = mass 0.74872 kg x 0.544 1/s, the largest mass-normalised rotor-drag coefficient in Faessler, Franchi, Scaramuzza, IEEE RA-L 3(2) 2018, arXiv:1712.02402, measured on another quadrotor; order-of-magnitude bound only (decision-sim-takeoff-landing-20261119.md section 5)" }

# Constant voltage: no internal resistance or discharge data exists.
[battery]
voltage = { v = 16.8, unit = "V", tag = "datasheet", src = "full 4S pack, the voltage of the vendor thrust table, CAD:model/motor_bench.yaml:10; owner 2026-11-19 took the recommendation" }

# Sensor profiles, at the firmware's default settings. What the sim emits is what the firmware hands to flight code:
# body FRD, calibration offsets already removed. Rates are the tick table (conventions 6), not card numbers.
# HANDOFF = FW:docs/handoff.md; PRESETS = PLAN:decision-sensor-presets-20261117.md; DS = PLAN:datasheets-text/.

# IMU1, ICM-45686, 16 g, 2000 dps, 800 Hz (FW:crates/fw-settings/src/imu.rs:105-110).
[imu1]
position = { v = [0.0, 0.0, 0.0], unit = "m", tag = "placeholder", range = "ask", src = "none: owner's open item (handoff:254); owner 2026-11-19 took the recommendation: at the centre of mass until given" }
gyro_noise_sd = { v = [1.382e-3, 1.396e-3, 2.057e-3], unit = "rad/s", tag = "measured", src = "at rest on the board, 600 s, 2026-11-17, HANDOFF:144; z is 1.5 times the datasheet model, cause not isolated" }
accel_noise_sd = { v = [0.01575, 0.01575, 0.01575], unit = "m/s^2", tag = "placeholder", range = "ask", src = "sqrt(density^2 * B + LSB^2 / 12): 80 ug/rtHz at 16 g (DS ICM-45686.txt:825), LSB 0.488 mg, B = 400 Hz ASSUMED (the bypass bandwidth is not in the datasheet, PRESETS:65-73); no at-rest measurement exists" }
gyro_bias = { v = [0.0, 0.0, 0.0], unit = "rad/s", tag = "placeholder", range = [-6.981e-3, 6.981e-3], src = "residual after calibration is not known; range: zero-rate tolerance +/-0.4 deg/s, board level, 25 C (DS ICM-45686.txt:762-764); raw at rest 5.05 / -2.42 / 2.02 mrad/s on 2026-11-17 (HANDOFF:144)" }
accel_bias = { v = [0.0, 0.0, 0.0], unit = "m/s^2", tag = "placeholder", range = [-0.1961, 0.1961], src = "residual after calibration is not known; range: zero-g tolerance +/-20 mg, board level, 25 C (DS ICM-45686.txt:817-819)" }
latency = { v = 0.0, unit = "s", tag = "placeholder", range = "ask", src = "none: the chip's filter delay is UNKNOWN (PRESETS:413-414)" }

# IMU2, LSM6DSK320X, 16 g, 2000 dps, 800 Hz. Its accelerometer magnitude reads 1.8 % low on the board (HANDOFF:132);
# that scale error is not modelled.
[imu2]
position = { v = [0.0, 0.0, 0.0], unit = "m", tag = "placeholder", range = "ask", src = "none: owner's open item (handoff:254); owner 2026-11-19 took the recommendation: at the centre of mass until given" }
gyro_noise_sd = { v = [1.014e-3, 0.978e-3, 1.932e-3], unit = "rad/s", tag = "measured", src = "at rest on the board, 600 s, 2026-11-17, HANDOFF:148; z is 1.4 times the datasheet model, cause not isolated" }
accel_noise_sd = { v = [0.01185, 0.01185, 0.01185], unit = "m/s^2", tag = "placeholder", range = "ask", src = "sqrt(density^2 * B + LSB^2 / 12): 60 ug/rtHz (DS LSM6DSK320X.txt:657), LSB 0.488 mg, B = 400 Hz ASSUMED (PRESETS:65-73); no at-rest measurement exists" }
gyro_bias = { v = [0.0, 0.0, 0.0], unit = "rad/s", tag = "placeholder", range = [-1.745e-2, 1.745e-2], src = "residual after calibration is not known; range: zero-rate level +/-1 deg/s (DS LSM6DSK320X.txt:647); raw at rest 3.07 / -3.29 / -3.10 mrad/s on 2026-11-17 (HANDOFF:148)" }
accel_bias = { v = [0.0, 0.0, 0.0], unit = "m/s^2", tag = "placeholder", range = [-0.1177, 0.1177], src = "residual after calibration is not known; range: zero-g offset accuracy +/-12 mg, low-g (DS LSM6DSK320X.txt:632)" }
latency = { v = 0.0, unit = "s", tag = "placeholder", range = "ask", src = "none: the delay per ODR is UNKNOWN (PRESETS:413-414)" }

# Barometer, BMP581, the firmware default (50 Hz, OSR x16 / x2, no IIR; FW:crates/fw-settings/src/baro.rs:27-35).
[baro]
pressure_noise_sd = { v = 0.179, unit = "Pa", tag = "measured", src = "at rest on the board, 60 s, 2026-11-17, a 1 s moving mean removed, sampled at 25/s (HANDOFF:88; PRESETS:491-492); the datasheet gives 0.21" }
pressure_bias = { v = 0.0, unit = "Pa", tag = "placeholder", range = [-30.0, 30.0], src = "none; range: absolute accuracy +/-30 Pa, 300 to 1100 hPa (DS BMP581.txt:407)" }
latency = { v = 0.0115, unit = "s", tag = "derived", src = "pressure conversion x16 10.4 ms + temperature conversion x2 1.1 ms, typical (DS BMP581.txt:650, 655; PRESETS:81-83)" }

# Compass, BMM350, the firmware default (100 Hz, averaging 2; FW:crates/fw-settings/src/mag.rs:37-38).
[compass]
field_noise_sd = { v = [0.148, 0.150, 0.338], unit = "uT", tag = "measured", src = "at rest on the board, 60 s, 2026-11-17, sampled at 25/s (HANDOFF:95; PRESETS:493-494); the datasheet gives 0.190 and 0.450" }
hard_iron_bias = { v = [0.0, 0.0, 0.0], unit = "uT", tag = "placeholder", range = "ask", src = "none: the residual after the firmware's compass calibration is not known; the datasheet's own offset is +/-2 uT typical after Bosch's calibration (DS BMM350.txt:408-414)" }
latency = { v = 0.005, unit = "s", tag = "placeholder", range = [0.0, 0.005], src = "a bound, not a datasheet figure: at most averaging x 2.5 ms (PRESETS:89-90)" }

# GNSS, Quectel LC76G. No datasheet for it is on disk: every field waits for the owner (before step 7).
[gnss]
horizontal_sd = { v = "ask", unit = "m", tag = "placeholder", range = "ask", src = "none: ask owner (module datasheet)" }
vertical_sd = { v = "ask", unit = "m", tag = "placeholder", range = "ask", src = "none: ask owner (module datasheet)" }
velocity_sd = { v = "ask", unit = "m/s", tag = "placeholder", range = "ask", src = "none: ask owner (module datasheet)" }
latency = { v = "ask", unit = "s", tag = "placeholder", range = "ask", src = "none: ask owner; a bench note in DRV:lc76g/docs/device.md is to be checked in step 7" }
