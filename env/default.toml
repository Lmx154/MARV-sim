# MARV sim environment. Schema and rules: MARV-V2-drivers/_plan/decision-sim-card-20261119.md, section 10.
# The origin here is a public reference point, never home. The real home goes in env/home.local.toml (git-ignored).

[env]
name = "default"
schema = 1
home_override = "env/home.local.toml"

[gravity]
g = { v = 9.80665, unit = "m/s^2", tag = "datasheet", src = "standard gravity (CGPM 1901, defined)" }

# ISA troposphere: the barometer sees pressure and temperature at the origin altitude minus down.
[atmosphere]
sea_level_pressure = { v = 101325.0, unit = "Pa", tag = "datasheet", src = "ISA, ISO 2533" }
sea_level_temperature = { v = 288.15, unit = "K", tag = "datasheet", src = "ISA, ISO 2533" }
lapse_rate = { v = 0.0065, unit = "K/m", tag = "datasheet", src = "ISA, ISO 2533" }

# A public landmark: the Royal Observatory, Greenwich (published position 51 deg 28' 40" N, 0 deg 00' 05" W, altitude 68 m;
# Wikipedia, "Royal Observatory, Greenwich").
[origin]
latitude = { v = 51.47783, unit = "deg", tag = "datasheet", src = "Royal Observatory, Greenwich: published position (Wikipedia), north positive" }
longitude = { v = -0.00139, unit = "deg", tag = "datasheet", src = "Royal Observatory, Greenwich: published position (Wikipedia), east positive" }
altitude = { v = 68.0, unit = "m", tag = "datasheet", src = "Royal Observatory, Greenwich: published altitude above mean sea level (Wikipedia)" }

# World Magnetic Model at [origin] (height 68 m) for 2026.886 (2026-11-20): MARV-GCS gcs-magcal example wmm, which is
# checked against NOAA's tables. derived (WMM2025).
[magnetic_field]
ned = { v = [19.561, 0.434, 45.067], unit = "uT", tag = "derived", src = "WMM2025 at [origin], 2026.886 (total 49.131 uT)" }
declination = { v = 1.271, unit = "deg", tag = "derived", src = "WMM2025 at [origin], 2026.886, east positive" }
inclination = { v = 66.532, unit = "deg", tag = "derived", src = "WMM2025 at [origin], 2026.886, down positive" }

# The wind scenario sets its own.
[wind]
mean_ned = { v = [0.0, 0.0, 0.0], unit = "m/s", tag = "placeholder", range = "ask", src = "none; owner 2026-11-19 took the recommendation: zero" }
gust_sd = { v = 0.0, unit = "m/s", tag = "placeholder", range = "ask", src = "none; owner 2026-11-19 took the recommendation: zero" }
