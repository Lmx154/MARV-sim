# DIAGNOSTIC RUN (decision-nav-eskf-20261120, Amendments G and G-1, packet P-G4): S8: takeoff-land.toml with the compass field rotated 90 deg about body x while the truth height is below 1 m. NOT part of the spread; the owner's test budget does not include it.
# Take off, fly and land (decision-sim-takeoff-landing-20261119, section 3; approved by the owner 2026-11-19): from the
# ground, the sim pilot (a test device in the harness, not flight code: section 2) lifts off, climbs to 1.5 m, hovers,
# flies a short pitch out and back and a yaw turn, descends and lands; then throttle 0 and switch off.
[scenario]
name = "takeoff-land-anomaly-x"
duration_s = 60.0                 # upper bound; the phases end it (expected about 39 s)
mag_fault = { from_s = 0.0, kind = "rotate", deg = 90.0, below_m = 1.0, axis = "x" }

[initial]
contact = "ground"                # "air" (default; the four old scenarios unchanged) | "ground"
ground_roll_pitch_deg = [0.0, 0.0]  # the ground plane; the matrix overrides it (slope)
yaw_deg = 0.0
rotors = "stopped"
settle_s = 0.08                   # after a touchdown, settle onto the ground plane in 0.08 s (Amendment B6, owner
                                  # 2026-11-19): a free pivot onto its feet takes 4 deg in about 0.08 s (I_edge
                                  # 0.00627 kg.m^2, alpha = 7.342 x 0.020 / 0.00627 = 23 rad/s^2)

[pilot]                           # the test device; every number section 10, approved
delay_s = 0.20
stick_rate_per_s = 2.0
ramp_stick_per_s = 0.125         # Amendment A (lead's ruling): a STICK ramp; 0.25 W/s under the 2 x map at the nominal point
airborne_m = 0.05                 # pilot "sees it leave the ground"; also the verdict's lift-off height
k_h = 0.8                         # 1/s
k_v = 1.5                         # 1/s
k_i = 0.3                         # 1/s^2
accel_max_g = 0.10
v_up_ms = 0.5
v_dn_ms = 0.5
xy_k = 1.0                        # 1/s
xy_stick_max = 0.25               # 7.5 deg
xy_ki = 0.25                      # 1/s^2, drift integral (Amendment B2; owner 2026-11-19)
stick_thrust_max_g = 2.0          # the documented stick map's top point (flight code's cap, rulings Amendment C)

[rc]                              # phases instead of a timed script; each starts when the last ends
phase = [
  { name = "ground",  after_s = 2.0, arm = false, throttle = "zero" },       # estimator initialises (Kp 2.5)
  { name = "idle",    after_s = 2.0, arm = true,  throttle = "zero" },       # arms at throttle 0 <= 0.05
  { name = "liftoff", event = "airborne", timeout_s = 10.0, throttle = "ramp" },
  { name = "climb",   after_s = 6.0, height_m = 1.5, xy = "hold" },
  { name = "hover",   after_s = 5.0, height_m = 1.5, xy = "hold" },
  { name = "fwd",     after_s = 1.5, height_m = 1.5, pitch = 0.2 },           # 6 deg forward, xy off
  { name = "back",    after_s = 1.5, height_m = 1.5, pitch = -0.2 },
  { name = "settle",  after_s = 3.0, height_m = 1.5, xy = "hold" },
  { name = "yaw",     after_s = 3.0, height_m = 1.5, yaw = 0.3, xy = "hold" }, # 45 deg/s (150 x 0.3), 135 deg
  { name = "steady",  after_s = 2.0, height_m = 1.5, xy = "hold" },
  { name = "descend", event = "below", below_m = 1.0, timeout_s = 10.0, descend_ms = 0.5, xy = "hold" },
  { name = "land",    event = "landed", timeout_s = 10.0, descend_ms = 0.3, xy = "hold" },
  { name = "cut",     after_s = 3.0, throttle = "zero" },
  { name = "disarm",  after_s = 1.0, arm = false, throttle = "zero" },
]                                 # events are seen through the pilot's delay; a timeout is a FAIL

[verdict]
check = "takeoff_land"            # the checks table of section 3; every threshold section 10, approved
arm_bound_s = 0.0065              # armed_on_ground: first non-Stop after switch-on (one report 4 ms + ESC tick)
r_stance_m = 0.020                # stance_margin: bottom-plate screw heads, abs(y) <= 20.0 mm
stance_floor_weight = 0.5         # stance_margin: judged while N >= 0.5 m g
max_stance_ratio = 1.0            # stance_margin: tau_xy / (N r_stance)
max_peak_height_m = 2.5           # peak_height_m, lift-off to touchdown (Amendment B4; owner 2026-11-19)
max_peak_climb_ms = 1.5           # peak_climb_ms, lift-off to touchdown (Amendment B4; owner 2026-11-19)
max_light_after_td_s = 0.6        # light_after_td_s: first touchdown until N >= 0.5 m g for good (Amendment A3(b))
liftoff_window_s = 1.0            # liftoff_tilt: over [lift-off, + 1 s]
max_liftoff_tilt_deg = 6.0        # liftoff_tilt: the hover disturbance peak
height_band_m = 0.3               # height_band: in hover, settle, yaw, steady
max_tilt_deg = 12.0               # tilt_max: while airborne
max_speed_h_ms = 0.5              # speed_h: in hover, yaw, steady, descend, land
max_nav_gap_deg = 5.0             # nav_gap: 1.15 + 1.60 + 1.88 = 4.63 deg, below
max_td_vz_ms = 0.5                # td_vz
max_td_vh_ms = 0.3                # td_vh
max_td_tilt_deg = 8.0             # td_tilt: the 6.33 deg lean needed to hold position in the matrix's 2 m/s wind at
                                  # the upper drag, plus margin; owner 2026-11-19 (was 5)
max_td_rate_dps = 20.0            # td_rate
idle_after_s = 0.010              # idle_after: from stick at 0 + 0.010 s to switch-off
stop_bound_s = 0.0065             # stop_after: within 0.0065 s of switch-off and after
hover_trim_tolerance = 0.05       # hover_trim: nominal cell only, mean thrust ratio in hover in 1 +/- 0.05
