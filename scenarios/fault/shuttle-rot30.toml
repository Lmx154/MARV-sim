[verdict]
check = "steps"
# Roll and pitch: the logged nav attitude (the estimate) against the setpoint's angle; yaw: truth yaw rate (body r)
# against the setpoint's heading rate. Each step and each return is judged over its 1.5 s hold window.
roll_at_s = 2.040             # 8b: step instants (the return is at + hold_s)
pitch_at_s = 5.040
yaw_at_s = 8.040
hold_s = 1.5                  # 8b
step_angle_deg = 15.0         # 8b: 0.5 of roll or pitch stick is 15 deg (ANGLE_MAX 30 deg); the setpoint must be this
step_yaw_rate_dps = 75.0      # 8b: 0.5 of yaw stick is 75 deg/s (PILOT_Y_RATE 150 deg/s)
max_rise_s = 0.6              # 8b, 13: 10-90 % rise time
max_overshoot_rp_pct = 10.0   # 8b, 13: roll and pitch
max_overshoot_yaw_pct = 25.0  # 8b, 13: yaw
