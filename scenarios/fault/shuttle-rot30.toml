  { t_s = 9.540, roll = 0.0, pitch = 0.0, yaw = 0.0, throttle = 0.5, arm = true },
  { t_s = 11.000, roll = 0.0, pitch = 0.3, yaw = 0.0, throttle = 0.5, arm = true },
