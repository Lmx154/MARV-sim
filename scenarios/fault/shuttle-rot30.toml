# DIAGNOSTIC RUN (decision-nav-eskf-20261120, Amendments G and G-1, packet P-G4): S7a-companion: compass rotated 30 deg from 10 s, steady lean; steps.toml's first 11 s (verdict windows unchanged), then a pitch shuttle of 0.3 stick (9 deg) alternating every 6 s, to keep the vehicle moving to 100 s. NOT part of the spread; the owner's test budget does not include it.
# Roll, pitch and yaw steps (decision-first-pair-20261119, 8b): the common preamble, hover 2 s after the throttle row,
# then roll 0.5 for 1.5 s and centre 1.5 s; pitch 0.5 the same way; yaw 0.5 the same way.
[scenario]
name = "shuttle-rot30"
duration_s = 100.0
mag_fault = { from_s = 10.0, kind = "rotate", deg = 30.0 }

[initial]
position_ned_m = [0.0, 0.0, 0.0]
velocity_ned_ms = [0.0, 0.0, 0.0]
roll_pitch_yaw_deg = [0.0, 0.0, 0.0]
rates_rads = [0.0, 0.0, 0.0]
rotors = "hover"

[rc]
script = [
  { t_s = 0.0,   roll = 0.0, pitch = 0.0, yaw = 0.0, throttle = 0.0, arm = false },
  { t_s = 0.020, roll = 0.0, pitch = 0.0, yaw = 0.0, throttle = 0.0, arm = true },
  { t_s = 0.040, roll = 0.0, pitch = 0.0, yaw = 0.0, throttle = 0.5, arm = true },
