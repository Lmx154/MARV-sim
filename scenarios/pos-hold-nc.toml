# Position hold negative controls NC1 (switch stays at the middle) and NC3 (compass turned 90 deg from the pre-roll), P7: each must FAIL in every cell.
# Nominal point, the two wind cells (NC1 is defined in a wind cell), seeds 1-3. Run with `--estimator eskf3 --preroll 60`.
# NC2 (the effective mode ignores coverage) has no scenario: it needs a firmware switch that does not exist in a release build.
scenarios = ["negative/pos-hold-nc1.toml", "negative/pos-hold-nc3.toml"]
points = [
  { kf_scale = 1.0, inertia_scale = 1.0 },                    # P0: nominal card
]
air = [
  { drag = 0.197, wind_ned = [5.0, 0.0, 0.0] },        # 1: 5 m/s toward the north
  { drag = 0.197, wind_ned = [0.0, 5.0, 0.0] },        # 2: 5 m/s toward the east
]
seeds = [1, 2, 3]
