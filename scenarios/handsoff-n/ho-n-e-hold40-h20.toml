# Campaign N E: FS_HOLD_EN 1, stick loss after 20 s at 20 m (HOLD), yaw held at truth + 40 deg from 122 s.
[scenario]
name = "ho-n-e-hold40-h20"
duration_s = 208.7
thrust_gain = { from_s = 0.0, to_s = 1.0, from = 1.000, to = 1.000 }
yaw_hold = { at_s = 122.0, deg = 40.0 }
[initial]
contact = "ground"
ground_roll_pitch_deg = [0.0, 0.0]
yaw_deg = 0.0
rotors = "stopped"
settle_s = 0.08

[pilot]                           # the test device; every number section 10, approved
delay_s = 0.20
stick_rate_per_s = 2.0
ramp_stick_per_s = 0.125         # Amendment A (lead's ruling): a STICK ramp; 0.25 W/s under the 2 x map at the nominal point
airborne_m = 0.05                 # pilot "sees it leave the ground"; also the verdict's lift-off height
k_h = 0.8                         # 1/s
k_v = 1.5                         # 1/s
k_i = 0.3                         # 1/s^2
accel_max_g = 0.10
v_up_ms = 2.0
v_dn_ms = 1.0
xy_k = 1.0                        # 1/s
xy_stick_max = 0.25               # 7.5 deg
xy_ki = 0.25                      # 1/s^2, drift integral (Amendment B2; owner 2026-11-19)
stick_thrust_max_g = 2.0          # the documented stick map's top point (flight code's cap, rulings Amendment C)

[rc]
phase = [
  { name = "ground", after_s = 60.0, arm = false, throttle = "zero", mode = "high" },
  { name = "idle", after_s = 2.0, arm = true, throttle = "zero" },
  { name = "liftoff", event = "airborne", timeout_s = 10.0, throttle = "ramp" },
  { name = "climb", after_s = 16.0, height_m = 20.0 },
  { name = "hover", after_s = 20.0, height_m = 20.0, xy = "hold" },
  { name = "lost", after_s = 400.0, height_m = 0.0, lost = true },
]

[verdict]
check = "takeoff_land"            # the checks table of section 3; every threshold section 10, approved
arm_bound_s = 0.0065              # armed_on_ground: first non-Stop after switch-on (one report 4 ms + ESC tick)
r_stance_m = 0.020                # stance_margin: bottom-plate screw heads, abs(y) <= 20.0 mm
stance_floor_weight = 0.5         # stance_margin: judged while N >= 0.5 m g
max_stance_ratio = 1.0            # stance_margin: tau_xy / (N r_stance)
max_peak_height_m = 2.5           # peak_height_m, lift-off to touchdown (Amendment B4; owner 2026-11-19)
max_peak_climb_ms = 1.5           # peak_climb_ms, lift-off to touchdown (Amendment B4; owner 2026-11-19)
max_light_after_td_s = 0.6        # light_after_td_s: first touchdown until N >= 0.5 m g for good (Amendment A3(b))
liftoff_window_s = 1.0            # liftoff_tilt: over [lift-off, + 1 s]
max_liftoff_tilt_deg = 6.0        # liftoff_tilt: the hover disturbance peak
height_band_m = 0.3               # height_band: in hover, settle, yaw, steady
max_tilt_deg = 12.0               # tilt_max: while airborne
max_speed_h_ms = 0.5              # speed_h: in hover, yaw, steady, descend, land
max_nav_gap_deg = 5.0             # nav_gap: 1.15 + 1.60 + 1.88 = 4.63 deg, below
max_td_vz_ms = 0.5                # td_vz
max_td_vh_ms = 0.3                # td_vh
max_td_tilt_deg = 8.0             # td_tilt: the 6.33 deg lean needed to hold position in the matrix's 2 m/s wind at
                                  # the upper drag, plus margin; owner 2026-11-19 (was 5)
max_td_rate_dps = 20.0            # td_rate
idle_after_s = 0.010              # idle_after: from stick at 0 + 0.010 s to switch-off
stop_bound_s = 0.0065             # stop_after: within 0.0065 s of switch-off and after
hover_trim_tolerance = 0.05       # hover_trim: nominal cell only, mean thrust ratio in hover in 1 +/- 0.05
