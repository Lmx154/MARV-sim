# Position hold, P7 PS1 (decision-nav-eskf-20261120, Amendment P, Addendum P-1): 5 spread points (as spread.toml) x 3 air x 3 seeds = 45
# cells of pos-hold.toml. Run: marv-run --spread scenarios/pos-hold-spread.toml --estimator eskf3 --preroll 60 ...
# The plant and the backend take a point; the flight code keeps the compiled card.
# kf_scale scales k_F; inertia_scale scales the whole inertia tensor; lag_s sets BOTH motor time constants.
scenarios = ["pos-hold.toml"]   # relative to this file
points = [
  { kf_scale = 1.0, inertia_scale = 1.0 },                    # P0: nominal card
  { kf_scale = 0.7, inertia_scale = 1.25, lag_s = 0.060 },    # P1
  { kf_scale = 0.7, inertia_scale = 1.25, lag_s = 0.030 },    # P2
  { kf_scale = 1.3, inertia_scale = 0.75, lag_s = 0.060 },    # P3
  { kf_scale = 1.3, inertia_scale = 0.75, lag_s = 0.030 },    # P4
]

# Air (P7; Addendum P-1: no Position cell with zero drag). Linear rotor drag 0.197 N/(m/s) (the amendment's number; the drag
# measured on log 281, 0.19 N/(m/s), band 0.15..0.23, lies inside it). Wind is the plant's constant wind, NED m/s, the direction the air moves toward.
air = [
  { drag = 0.197 },                                    # 1: calm
  { drag = 0.197, wind_ned = [5.0, 0.0, 0.0] },        # 2: 5 m/s toward the north
  { drag = 0.197, wind_ned = [0.0, 5.0, 0.0] },        # 3: 5 m/s toward the east
]
seeds = [1, 2, 3]
