# Altitude hold (decision-nav-eskf-20261120, Amendment F, F9; run with `--estimator eskf2 --preroll 2.0`): the hover
# preamble ("arm in the air"), switch to the middle (Altitude) at 3 s, a roll torque step at 12 s, a climb stick at
# 23..24 s, a descent stick at 34..36 s, and a barometer loss at 46..51.5 s (the flight code falls back to Angle when
# its vertical flags drop, and returns to Altitude when the barometer is fused again).
[scenario]
name = "alt-hold"
duration_s = 56.0
baro_lost = [[46.0, 51.5]]     # F9: no barometer sample reaches the flight code (the model keeps running)

[initial]
position_ned_m = [0.0, 0.0, 0.0]
velocity_ned_ms = [0.0, 0.0, 0.0]
roll_pitch_yaw_deg = [0.0, 0.0, 0.0]
rates_rads = [0.0, 0.0, 0.0]
rotors = "hover"

[rc]
# `mode` is the channel-6 switch: "low" (Angle, the default), "middle" (Altitude), "high" (Position, capped to Altitude).
script = [
  { t_s = 0.0,   roll = 0.0, pitch = 0.0, yaw = 0.0, throttle = 0.0, arm = false },                      # F9: switch off, throttle 0
  { t_s = 0.020, roll = 0.0, pitch = 0.0, yaw = 0.0, throttle = 0.0, arm = true },                       # F9: arm
  { t_s = 0.040, roll = 0.0, pitch = 0.0, yaw = 0.0, throttle = 0.5, arm = true },                       # F9: throttle 0.5
  { t_s = 3.0,   roll = 0.0, pitch = 0.0, yaw = 0.0, throttle = 0.5, arm = true, mode = "middle" },      # F9: mode middle
  { t_s = 23.0,  roll = 0.0, pitch = 0.0, yaw = 0.0, throttle = 0.8, arm = true, mode = "middle" },      # F2: 3.0 x (0.8 - 0.6)/0.4 = 1.5 m/s up
  { t_s = 24.0,  roll = 0.0, pitch = 0.0, yaw = 0.0, throttle = 0.5, arm = true, mode = "middle" },
  { t_s = 34.0,  roll = 0.0, pitch = 0.0, yaw = 0.0, throttle = 0.2, arm = true, mode = "middle" },      # F2: 1.5 x (0.4 - 0.2)/0.4 = 0.75 m/s down
  { t_s = 36.0,  roll = 0.0, pitch = 0.0, yaw = 0.0, throttle = 0.5, arm = true, mode = "middle" },
]

# F9: the roll torque step of hover.toml (8a), 0.046 N.m body frame, from 12 s on.
[[disturbance]]
from_s = 12.0
torque_nm = [0.046, 0.0, 0.0]

[verdict]
check = "alt_hold"
windows = [[8.0, 23.0], [29.0, 34.0], [41.0, 46.0]]   # F9: judged over [8, 23], [29, 34], [41, 46] s
max_height_error_m = 0.5      # F9: |truth D - target D (SPN.PD)| <= 0.5 m
max_nav_gap_m = 0.3           # F9 and the owner's ruling on a2: |nav D - truth D - barometer-model drift| <= 0.3 m (raw reported)
climb_from_s = 23.0           # F9: climb height = the target's change over 23..24 s (reported, not judged)
climb_to_s = 24.0
descent_from_s = 34.0         # F9: descent height = the target's change over 34..36 s (reported, not judged)
descent_to_s = 36.0
enter_s = 3.0                 # F9: the effective mode goes Angle -> Altitude at 3.0 s
enter_bound_s = 0.01          # lead's reading: within 10 ms (one 4 ms stick report plus a 1.25 ms flight step, with margin)
baro_lost_from_s = 46.0       # F9: the loss begins; Altitude -> Angle within one step of the vertical flags dropping
baro_lost_to_s = 51.5         # F9: the loss ends; Angle -> Altitude within one step of the flags returning
